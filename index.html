<script>

/* ==========================================
   MRLEGEND CRYPTO MARKET
========================================== */


/*
  CoinGecko coin IDs
*/

const marketTokens = [

  {
    id: "bitcoin",
    name: "Bitcoin",
    symbol: "BTC"
  },

  {
    id: "ethereum",
    name: "Ethereum",
    symbol: "ETH"
  },

  {
    id: "binancecoin",
    name: "BNB",
    symbol: "BNB"
  },

  {
    id: "solana",
    name: "Solana",
    symbol: "SOL"
  },

  {
    id: "ripple",
    name: "XRP",
    symbol: "XRP"
  },

  {
    id: "dogecoin",
    name: "Dogecoin",
    symbol: "DOGE"
  },

  {
    id: "cardano",
    name: "Cardano",
    symbol: "ADA"
  },

  {
    id: "avalanche-2",
    name: "Avalanche",
    symbol: "AVAX"
  },

  {
    id: "chainlink",
    name: "Chainlink",
    symbol: "LINK"
  },

  {
    id: "polkadot",
    name: "Polkadot",
    symbol: "DOT"
  }

];


let marketData = [];

let currentToken = null;

let tokenChart = null;


/* ==========================================
   FORMAT PRICE
========================================== */

function formatPrice(price) {

  if (price === null || price === undefined) {
    return "$0.00";
  }

  if (price >= 1000) {

    return "$" + price.toLocaleString(
      "en-US",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

  }

  if (price >= 1) {

    return "$" + price.toLocaleString(
      "en-US",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 4
      }
    );

  }

  return "$" + price.toLocaleString(
    "en-US",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 8
    }
  );

}


/* ==========================================
   FORMAT LARGE NUMBER
========================================== */

function formatLargeNumber(number) {

  if (!number) {
    return "$0";
  }

  if (number >= 1e12) {
    return "$" + (number / 1e12).toFixed(2) + "T";
  }

  if (number >= 1e9) {
    return "$" + (number / 1e9).toFixed(2) + "B";
  }

  if (number >= 1e6) {
    return "$" + (number / 1e6).toFixed(2) + "M";
  }

  if (number >= 1e3) {
    return "$" + (number / 1e3).toFixed(2) + "K";
  }

  return "$" + number.toLocaleString();

}


/* ==========================================
   LOAD MARKET
========================================== */

async function loadMarket() {

  const grid =
    document.getElementById("marketGrid");

  try {

    const ids = marketTokens
      .map(token => token.id)
      .join(",");

    const url =
      "https://api.coingecko.com/api/v3/coins/markets" +
      "?vs_currency=usd" +
      "&ids=" + ids +
      "&order=market_cap_desc" +
      "&per_page=50" +
      "&page=1" +
      "&sparkline=false" +
      "&price_change_percentage=24h";

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error("Market API error");
    }

    const data =
      await response.json();

    marketData = data;

    renderMarket(data);

  }

  catch (error) {

    console.error(error);

    grid.innerHTML = `

      <div class="market-loading">

        <p>
          Unable to load live market.
        </p>

        <button
          onclick="loadMarket()"
          style="
            padding:10px 18px;
            border:0;
            border-radius:8px;
            cursor:pointer;
          "
        >
          Retry
        </button>

      </div>

    `;

  }

}


/* ==========================================
   RENDER MARKET
========================================== */

function renderMarket(data) {

  const grid =
    document.getElementById("marketGrid");

  if (!data.length) {

    grid.innerHTML =
      `<div class="market-loading">
        No market data found.
      </div>`;

    return;
  }

  grid.innerHTML =
    data.map(token => {

      const change =
        token.price_change_percentage_24h || 0;

      const changeClass =
        change >= 0
          ? "price-up"
          : "price-down";

      const arrow =
        change >= 0
          ? "▲"
          : "▼";

      return `

        <div
          class="token-card"
          data-name="${token.name.toLowerCase()}"
          data-symbol="${token.symbol.toLowerCase()}"
          onclick="openToken('${token.id}')"
        >

          <div class="token-card-top">

            <div class="token-left">

              <img
                class="token-icon"
                src="${token.image}"
                alt="${token.name}"
                loading="lazy"
              >

              <div>

                <div class="token-name">
                  ${token.name}
                </div>

                <div class="token-symbol">
                  ${token.symbol}
                </div>

              </div>

            </div>

            <span class="${changeClass}">
              ${arrow}
            </span>

          </div>

          <div class="token-price">
            ${formatPrice(token.current_price)}
          </div>

          <div class="token-bottom">

            <span class="token-change ${changeClass}">
              ${change >= 0 ? "+" : ""}
              ${change.toFixed(2)}%
            </span>

            <span style="opacity:.5;font-size:12px;">
              24H
            </span>

          </div>

        </div>

      `;

    }).join("");

}


/* ==========================================
   OPEN TOKEN
========================================== */

async function openToken(tokenId) {

  const token =
    marketData.find(
      item => item.id === tokenId
    );

  if (!token) return;

  currentToken = token;

  const modal =
    document.getElementById("tokenModal");

  modal.classList.add("active");

  document.body.style.overflow = "hidden";


  document.getElementById(
    "modalTokenIcon"
  ).innerHTML = `

    <img
      src="${token.image}"
      style="
        width:100%;
        height:100%;
        border-radius:50%;
      "
    >

  `;


  document.getElementById(
    "modalTokenName"
  ).textContent =
    token.name;


  document.getElementById(
    "modalTokenSymbol"
  ).textContent =
    token.symbol.toUpperCase();


  document.getElementById(
    "modalTokenPrice"
  ).textContent =
    formatPrice(token.current_price);


  const change =
    token.price_change_percentage_24h || 0;


  const changeElement =
    document.getElementById(
      "modalTokenChange"
    );

  changeElement.textContent =
    `${change >= 0 ? "+" : ""}${change.toFixed(2)}% 24H`;


  changeElement.className =
    change >= 0
      ? "price-up"
      : "price-down";


  document.getElementById(
    "modalHigh"
  ).textContent =
    formatPrice(token.high_24h);


  document.getElementById(
    "modalLow"
  ).textContent =
    formatPrice(token.low_24h);


  document.getElementById(
    "modalMarketCap"
  ).textContent =
    formatLargeNumber(
      token.market_cap
    );


  document.getElementById(
    "modalVolume"
  ).textContent =
    formatLargeNumber(
      token.total_volume
    );


  await loadTokenChart(token.id);

}


/* ==========================================
   TOKEN CHART
========================================== */

async function loadTokenChart(tokenId) {

  const status =
    document.getElementById(
      "chartStatus"
    );

  status.textContent =
    "Loading...";


  try {

    const url =
      `https://api.coingecko.com/api/v3/coins/${tokenId}/market_chart?vs_currency=usd&days=7&interval=daily`;

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error("Chart API error");
    }

    const data =
      await response.json();

    const prices =
      data.prices || [];


    const labels =
      prices.map(item => {

        const date =
          new Date(item[0]);

        return date.toLocaleDateString(
          "en-US",
          {
            month: "short",
            day: "numeric"
          }
        );

      });


    const values =
      prices.map(item => item[1]);


    const ctx =
      document
        .getElementById("tokenChart")
        .getContext("2d");


    if (tokenChart) {
      tokenChart.destroy();
    }


    tokenChart =
      new Chart(ctx, {

        type: "line",

        data: {

          labels: labels,

          datasets: [

            {
              data: values,

              borderWidth: 2,

              pointRadius: 0,

              tension: .35,

              fill: true

            }

          ]

        },

        options: {

          responsive: true,

          maintainAspectRatio: false,

          plugins: {

            legend: {
              display: false
            }

          },

          scales: {

            x: {
              display: true,

              grid: {
                display: false
              }
            },

            y: {

              display: true,

              grid: {
                color:
                  "rgba(255,255,255,.07)"
              },

              ticks: {

                callback: function(value) {

                  return "$" +
                    Number(value)
                      .toLocaleString();

                }

              }

            }

          }

        }

      });


    status.textContent =
      "Last 7 days";

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Chart unavailable";

  }

}


/* ==========================================
   CLOSE MODAL
========================================== */

document
  .getElementById("closeTokenModal")
  .addEventListener(
    "click",
    closeTokenModal
  );


function closeTokenModal() {

  document
    .getElementById("tokenModal")
    .classList.remove("active");

  document.body.style.overflow = "";

}


/* CLOSE WHEN CLICK OUTSIDE */

document
  .getElementById("tokenModal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeTokenModal();

      }

    }
  );


/* ESCAPE KEY */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeTokenModal();

    }

  }
);


/* ==========================================
   SEARCH
========================================== */

document
  .getElementById("tokenSearch")
  .addEventListener(
    "input",
    function() {

      const search =
        this.value
          .toLowerCase()
          .trim();


      document
        .querySelectorAll(
          ".token-card"
        )
        .forEach(card => {

          const name =
            card.dataset.name;

          const symbol =
            card.dataset.symbol;


          if (
            name.includes(search) ||
            symbol.includes(search)
          ) {

            card.style.display =
              "block";

          }

          else {

            card.style.display =
              "none";

          }

        });

    }
  );


/* ==========================================
   DISCORD @emon688
========================================== */

document
  .getElementById("discordButton")
  .addEventListener(
    "click",
    async function() {

      const username =
        "@emon688";

      try {

        await navigator.clipboard.writeText(
          username
        );

        this.innerHTML =
          '<i class="fab fa-discord"></i> Copied @emon688';

        setTimeout(() => {

          this.innerHTML =
            '<i class="fab fa-discord"></i> Copy Discord';

        }, 2000);

      }

      catch (error) {

        alert(
          "Discord username: @emon688"
        );

      }

    }
  );


/* ==========================================
   START
========================================== */

loadMarket();


/* AUTO UPDATE EVERY 60 SECONDS */

setInterval(
  loadMarket,
  60000
);

</script>
